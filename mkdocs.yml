site_name: Vector Office AI Core
site_description: Technische Dokumentation und Entwicklungsverlauf
repo_url: https://github.com/andrewojak1618-debug/VECTOR-OFFICE-AI
repo_name: VECTOR-OFFICE-AI

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true

nav:
  - Start: index.md
  - Entwicklung: progress.md
  - Architektur: architecture.md
  - Homeserver & Docker: deployment.md
  - Provider-Zuverlässigkeit: provider-reliability.md
  - Datenschutz: privacy.md
  - Codequalität: quality.md
  - Teststrategie: testing.md
  - Spracheingabe: voice.md
  - Gedächtnis: memory.md
  - Wartung & Export: maintenance.md
  - Tools & Berechtigungen: tools-security.md
  - Kontrollierte Robot-Aktionen: robot-actions.md
  - Lokale Embeddings: embeddings.md
  - Paraphrasen-Test: paraphrase-evaluation.md
  - Physischer Wissenstest: physical-knowledge-test.md
  - Persönlichkeit: personality.md
  - Systemabnahme: release-acceptance.md
  - Laufzeitdiagnose: diagnostics.md
  - Provider-Sitzungen: provider-sessions.md
  - Verbindungsaufsicht: connections.md
  - Windows-Autostart: windows-startup.md
  - Roadmap: roadmap.md
  - API-Referenz:
      - Application: api/application.md
      - Brain: api/brain.md
      - Memory: api/memory.md
      - Tools: api/tools.md
      - Vector & Voice: api/vector-voice.md
